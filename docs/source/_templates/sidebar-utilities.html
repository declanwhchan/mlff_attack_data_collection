<div
  class="research-sidebar-utilities"
  aria-label="Website controls"
>
  <button
    id="research-theme-toggle"
    class="research-theme-toggle"
    type="button"
    data-theme-mode="auto"
    aria-label="Theme: system. Click to use light theme."
    title="Theme: system"
  >
    <svg
      class="theme-icon theme-icon-system"
      aria-hidden="true"
      viewBox="0 0 24 24"
    >
      <circle cx="12" cy="12" r="9" />
      <path
        class="theme-icon-fill"
        d="M12 3a9 9 0 0 0 0 18Z"
      />
    </svg>

    <svg
      class="theme-icon theme-icon-light"
      aria-hidden="true"
      viewBox="0 0 24 24"
    >
      <circle cx="12" cy="12" r="4" />
      <path d="M12 2V4" />
      <path d="M12 20V22" />
      <path d="M4.93 4.93L6.34 6.34" />
      <path d="M17.66 17.66L19.07 19.07" />
      <path d="M2 12H4" />
      <path d="M20 12H22" />
      <path d="M4.93 19.07L6.34 17.66" />
      <path d="M17.66 6.34L19.07 4.93" />
    </svg>

    <svg
      class="theme-icon theme-icon-dark"
      aria-hidden="true"
      viewBox="0 0 24 24"
    >
      <path
        d="M20.5 15.2A8.4 8.4 0 0 1 8.8 3.5
           8.7 8.7 0 1 0 20.5 15.2Z"
      />
    </svg>
  </button>

  <div class="research-project-links">
    {% include "navbar-icon-links.html" %}
  </div>
</div>
